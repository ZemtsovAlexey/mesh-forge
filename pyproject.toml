[project]
name = "mesh-forge"
version = "0.1.0"
description = "Local 3D mesh chat agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.7.0",
    "fastapi>=0.115.0",
    "fast-simplification>=0.1.7",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0,<2.0",
    "onnxruntime>=1.17.0",
    "open3d>=0.18.0",
    "openai>=1.50.0",
    "pillow>=10.0.0",
    "pydantic-ai>=2.9,<3",
    "pymeshlab>=2023.12",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rembg>=2.0.50",
    "trimesh>=4.4.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mesh_forge", "api"]

[tool.uv]
package = true
